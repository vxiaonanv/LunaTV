name: Short drama branch Docker build
on:
  push:
    branches: [feature/short-drama]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate Dockerfile and build image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: lunatv-short-drama:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
