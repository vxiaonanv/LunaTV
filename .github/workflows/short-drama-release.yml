name: Release LunaTV short drama
on:
  push:
    branches: [release/100.1.4]
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Verify release image build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: lunatv:100.1.4-verify
          cache-from: type=gha
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable release version
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/vxiaonanv/lunatv:100.1.4
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v100.1.4 --target "$GITHUB_SHA" --title "LunaTV 100.1.4" --notes "短剧功能正式版：分类、列表、搜索、详情、播放；短剧配置面板；TV 短剧接口。" --verify-tag
